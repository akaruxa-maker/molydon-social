name: Provjera
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Provjeri zakazane objave
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          GRAPH_VERSION: v25.0
        run: python3 tools/check_posts.py
      - name: Spremi
        if: always()
        run: |
          git config user.name "molydon-bot"; git config user.email "bot@users.noreply.github.com"
          git add state/_provjera.json; git commit -m "provjera" || true; git pull --rebase -q || true; git push || true
